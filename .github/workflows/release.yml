name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags, releases and the release commit
  issues: write # semantic-release comments on released issues
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the whole history to pick a version
          persist-credentials: false # let semantic-release push with GITHUB_TOKEN

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
